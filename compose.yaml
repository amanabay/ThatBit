services:
  reader:
    build:
      context: .
      dockerfile: deploy/Dockerfile.reader
    ports:
      - "127.0.0.1:4320:4320"
    environment:
      READER_WRITE_TOKEN: ${READER_WRITE_TOKEN:?Set a local writer token of at least 32 characters}
    volumes:
      - replay-data:/var/data
volumes:
  replay-data:
