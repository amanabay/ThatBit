<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#100c19" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Keep the message. Replay the reply." />
    <title>ThatBit — Every reply has a replay</title>
    <script>
      (() => {
        let theme = "dark";
        try {
          if (
            (localStorage.getItem("thatbit-theme") ??
              localStorage.getItem("replylink-theme")) === "light"
          )
            theme = "light";
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#100c19" : "#f4f0fa";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
